# Lokalne środowisko deweloperskie: MySQL 8.4 (ta sama wersja co na produkcji).
# PHP działa bezpośrednio w WSL. Uruchomienie: docker compose up -d
# Hasła poniżej służą wyłącznie do pracy lokalnej.
services:
  mysql:
    image: mysql:8.4
    container_name: udzio-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: udzio
      MYSQL_USER: udzio
      MYSQL_PASSWORD: udzio
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
